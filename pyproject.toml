[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-auto-orchestrator"
version = "0.1.0"
description = "Offline coordination contract and deterministic state-machine simulator"
requires-python = ">=3.11"
dependencies = ["openai>=1.68.0"]

[project.scripts]
orchestrator-sim = "orchestrator.simulator:main"
orchestrator-live-review = "orchestrator.live_review:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
